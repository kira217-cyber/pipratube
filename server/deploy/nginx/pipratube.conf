# PipraTube — nginx for all four domains on one VPS.
# Copy to /etc/nginx/sites-available/pipratube.conf, link it into
# sites-enabled, then run certbot (see deploy/DEPLOY.md) to add HTTPS.
#
#   pipratube.com          → /var/www/pipratube/client/dist   (viewer site)
#   studio.pipratube.com   → /var/www/pipratube/studio/dist   (creator studio)
#   admin.pipratube.com    → /var/www/pipratube/admin/dist    (admin panel)
#   api.pipratube.com      → Node API on 127.0.0.1:5100       (PM2)

# Apps that fetch a link to show its preview (title + picture). They don't
# run JavaScript, so their requests for pages of pipratube.com go to the
# API's /api/og, which answers with that video's/channel's details.
map $http_user_agent $link_preview_bot {
    default 0;
    "~*(facebookexternalhit|facebot|meta-externalagent|twitterbot|whatsapp|telegrambot|linkedinbot|slackbot|slack-imgproxy|discordbot|skypeuripreview|pinterest|viber|redditbot|applebot|googlebot|google-inspectiontool|bingbot|yandex|duckduckbot|embedly|iframely|vkshare|snap url preview|kakaotalk|line/|tumblr|mastodon|bluesky|quora link preview|outbrain|w3c_validator|zalo)" 1;
}

# ---------- API ----------
server {
    listen 80;
    server_name api.pipratube.com;

    # Video uploads go up to 2 GB and stream straight through to Bunny —
    # don't let nginx buffer them to disk first, and give them time.
    client_max_body_size 2100M;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # socket.io (live analytics)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ---------- Viewer site ----------
server {
    listen 80;
    server_name pipratube.com www.pipratube.com;
    root /var/www/pipratube/client/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build files never change — cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # Every other path is a page of the app (/watch/…, /@handle, /shorts…).
    location / {
        add_header Cache-Control "no-cache";
        # Link previews: pages (not files like /og-logo.png) go to the API.
        if ($link_preview_bot) {
            rewrite ^/[^.]*$ /__link-preview last;
        }
        try_files $uri $uri/ /index.html;
    }
    location = /__link-preview {
        internal;
        proxy_pass http://127.0.0.1:5100/api/og;
        proxy_set_header Host api.pipratube.com;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- Studio ----------
server {
    listen 80;
    server_name studio.pipratube.com;
    root /var/www/pipratube/studio/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

# ---------- Admin ----------
server {
    listen 80;
    server_name admin.pipratube.com;
    root /var/www/pipratube/admin/dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow";
        try_files $uri $uri/ /index.html;
    }
}
